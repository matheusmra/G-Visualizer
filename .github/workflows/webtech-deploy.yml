name: Deploy to WebTech Network

on:
  push:
    branches: [main, main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger WebTech deploy
        run: |
          curl -sf -X POST http://localhost:3000/api/webhook/deploy \
            -H "Content-Type: application/json" \
            -d '{"projectUuid":"${{ secrets.WEBTECH_PROJECT_UUID }}"}'